<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | HostelCare</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
      .register-container {
        max-width: 450px;
        margin: 60px auto;
        padding: 30px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      .register-container h2 {
        text-align: center;
        margin-bottom: 25px;
      }
      .register-container input {
        width: 100%;
        padding: 12px;
        margin: 8px 0 18px;
        box-sizing: border-box;
      }
      .register-container button {
        width: 100%;
        padding: 12px;
        cursor: pointer;
      }
      .register-container p {
        text-align: center;
      }
      .error {
        color: red;
        text-align: center;
      }
    </style>
</head>
<body>

<div class="register-container">
  <h2>Create Student Account</h2>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  <form method="POST">
    <label>Full Name</label>
    <input type="text" name="student_name" placeholder="Enter your full name" required>

    <label>Email Address</label>
    <input type="email" name="email" placeholder="Enter your email" required>

    <label>Password</label>
    <input type="password" name="password" placeholder="Create password" minlength="8" required>

    <label>Confirm Password</label>
    <input type="password" name="confirm_password" placeholder="Confirm password" minlength="8" required>

    <button type="submit">Register</button>
  </form>

  <p>Already have an account? <a href="{{ url_for('student_login') }}">Login</a> </p>
</div>

</body>
</html>
